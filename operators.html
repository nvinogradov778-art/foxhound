<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FOXHOUND — Оперативники</title>
    <style>
        :root {
            --bg-color: #1a1f1d;
            --panel-bg: #242b28;
            --accent-color: #e67e22;
            --text-color: #e0e0e0;
            --text-muted: #a0a8a4;
            --border-color: #34403a;
            --card-bg: rgba(0,0,0,0.4);
            --green: #2ecc71;
            --red: #e74c3c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
            overflow-x: hidden;
        }

        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
            pointer-events: none;
        }

        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: -1;
            pointer-events: none;
        }

        .container {
            max-width: 1000px;
            width: 100%;
            background: var(--panel-bg);
            border: 2px solid var(--accent-color);
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            position: relative;
            z-index: 1;
        }

        /* ===== ШАПКА ===== */
        .header {
            text-align: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 25px;
            margin-bottom: 25px;
        }

        .logo-image {
            width: 150px;
            height: 150px;
            object-fit: contain;
            margin: 0 auto 20px;
            display: block;
            background: #000;
            border: 2px solid var(--accent-color);
            border-radius: 4px;
            padding: 5px;
        }

        h1 {
            color: #fff;
            font-size: 24px;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .subtitle {
            color: var(--accent-color);
            font-size: 14px;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 2px;
        }

        /* ===== НАВИГАЦИЯ ===== */
        .header-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
        }

        .header-link {
            display: inline-block;
            background: rgba(230, 126, 34, 0.15);
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 8px 18px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            text-decoration: none;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
        }

        .header-link:hover {
            background: var(--accent-color);
            color: #fff;
        }

        .header-link.active {
            background: var(--accent-color);
            color: #fff;
            cursor: default;
        }

        .header-link.main {
            border-color: #95a5a6;
            color: #bdc3c7;
            background: rgba(149, 165, 166, 0.1);
        }
        .header-link.main:hover {
            background: #95a5a6;
            color: #fff;
        }
        .header-link.main.active {
            background: #95a5a6;
            color: #fff;
        }

        .header-link.calc {
            border-color: #2c3e50;
            color: #b0b8c0;
            background: rgba(44, 62, 80, 0.2);
        }
        .header-link.calc:hover {
            background: #2c3e50;
            color: #fff;
        }

        .header-link.photo {
            border-color: var(--green);
            color: var(--green);
            background: rgba(46, 204, 113, 0.1);
        }
        .header-link.photo:hover {
            background: var(--green);
            color: #fff;
        }

        .header-link.ops {
            border-color: var(--red);
            color: var(--red);
            background: rgba(231, 76, 60, 0.1);
        }
        .header-link.ops:hover {
            background: var(--red);
            color: #fff;
        }
        .header-link.ops.active {
            background: var(--red);
            color: #fff;
        }

        /* ===== ОПЕРАТИВНИКИ ===== */
        h2 {
            color: #fff;
            font-size: 18px;
            text-transform: uppercase;
            margin: 0 0 20px 0;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
        }
        h2::after {
            content: '';
            flex: 1;
            margin-left: 15px;
            height: 1px;
            background: var(--border-color);
        }

        .operator-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 700px) {
            .operator-grid {
                grid-template-columns: 1fr;
            }
        }

        .operator-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 20px;
            transition: transform 0.2s, border-color 0.2s;
            text-align: center;
        }

        .operator-card:hover {
            transform: scale(1.02);
            border-color: var(--accent-color);
        }

        .operator-avatar {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 10px;
            width: 100%;
            max-width: 120px;
            aspect-ratio: 1/1;
            border-radius: 50%;
            background: #111413;
            border: 2px solid var(--border-color);
            overflow: hidden;
            font-size: 56px;
        }

        .operator-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .operator-name {
            font-size: 20px;
            font-weight: bold;
            color: #fff;
        }

        .operator-role {
            color: var(--accent-color);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 5px 0 10px 0;
        }

        .operator-desc {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.5;
        }

        .operator-spec {
            display: inline-block;
            background: rgba(230, 126, 34, 0.2);
            border: 1px solid var(--accent-color);
            border-radius: 20px;
            padding: 2px 12px;
            font-size: 12px;
            color: var(--accent-color);
            margin-top: 8px;
        }

        .no-data {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-style: italic;
        }

        .error-msg {
            grid-column: 1 / -1;
            padding: 20px;
            text-align: center;
            color: var(--red);
            border: 1px solid var(--red);
            border-radius: 4px;
            background: rgba(231,76,60,0.1);
        }
    </style>
</head>
<body>

<video class="video-background" autoplay muted loop playsinline>
    <source src="background.mp4" type="video/mp4">
</video>
<div class="video-overlay"></div>

<div class="container">
    <!-- ===== ШАПКА ===== -->
    <div class="header">
        <img src="logo-foxhound.png" alt="FOXHOUND LOGO" class="logo-image" />
        <h1>FOXHOUND</h1>
        <div class="subtitle">Группа высокотехнологичных операций</div>

        <!-- Навигация -->
        <div class="header-links">
            <a href="index.html" class="header-link main">🏠 Главная</a>
            <a href="calculator.html" class="header-link calc">🧮 Калькулятор</a>
            <a href="photo.html" class="header-link photo">📸 Фото</a>
            <a href="operators.html" class="header-link ops active">👥 Оперативники</a>
        </div>
    </div>

    <!-- ===== ОПЕРАТИВНИКИ ===== -->
    <h2>Оперативный состав</h2>
    <div id="operatorsContainer" class="operator-grid">
        <div class="no-data">Загрузка данных...</div>
    </div>
</div>

<script>
    (function() {
        const container = document.getElementById('operatorsContainer');

        async function loadOperators() {
            try {
                const response = await fetch('operators_data.json');
                if (!response.ok) throw new Error('Не удалось загрузить данные');
                const data = await response.json();

                if (!data.operators || data.operators.length === 0) {
                    container.innerHTML = `<div class="no-data">Оперативников пока нет</div>`;
                    return;
                }

                container.innerHTML = '';
                data.operators.forEach(op => {
                    const card = document.createElement('div');
                    card.className = 'operator-card';

                    // Контейнер для аватара
                    const avatar = document.createElement('div');
                    avatar.className = 'operator-avatar';

                    // Проверяем наличие фото
                    if (op.photo) {
                        const img = document.createElement('img');
                        img.src = op.photo;
                        img.alt = op.name || 'Оператор';
                        // Если фото не загрузится – показываем эмодзи
                        img.onerror = function() {
                            this.style.display = 'none';
                            avatar.textContent = op.avatar || '👤';
                            avatar.style.fontSize = '56px';
                        };
                        avatar.appendChild(img);
                    } else {
                        avatar.textContent = op.avatar || '👤';
                        avatar.style.fontSize = '56px';
                    }

                    const name = document.createElement('div');
                    name.className = 'operator-name';
                    name.textContent = op.name || 'Без имени';

                    const role = document.createElement('div');
                    role.className = 'operator-role';
                    role.textContent = op.role || '';

                    const desc = document.createElement('div');
                    desc.className = 'operator-desc';
                    desc.textContent = op.description || '';

                    card.appendChild(avatar);
                    card.appendChild(name);
                    if (op.role) card.appendChild(role);
                    if (op.description) card.appendChild(desc);

                    if (op.specialization) {
                        const spec = document.createElement('div');
                        spec.className = 'operator-spec';
                        spec.textContent = op.specialization;
                        card.appendChild(spec);
                    }

                    container.appendChild(card);
                });
            } catch (error) {
                console.error('Ошибка загрузки оперативников:', error);
                container.innerHTML = `<div class="error-msg">❌ Ошибка загрузки данных. Проверьте файл operators_data.json</div>`;
            }
        }

        loadOperators();
    })();
</script>

</body>
</html>
